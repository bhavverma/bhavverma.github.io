<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Heart failure smartwatch publication cover art</title>
  <desc id="desc">Stylized smartwatch and heartbeat line to represent remote monitoring.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="20"/>
  <rect x="120" y="105" width="180" height="240" rx="36" fill="#fee2e2" opacity="0.95"/>
  <rect x="145" y="145" width="130" height="130" rx="20" fill="#b91c1c"/>
  <polyline points="155,208 180,208 195,180 212,232 230,190 248,208 268,208" fill="none" stroke="#fee2e2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="350" y="185" font-family="Arial, sans-serif" font-size="42" fill="#ffffff" font-weight="700">Remote Monitoring</text>
  <text x="350" y="235" font-family="Arial, sans-serif" font-size="26" fill="#fee2e2">Heart failure exacerbations with wearables</text>
</svg>
