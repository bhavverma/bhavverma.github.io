<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">HiTaxon publication cover art</title>
  <desc id="desc">Abstract visualization for hierarchical taxonomic classification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="20"/>
  <g fill="none" stroke="#bfdbfe" stroke-width="5" opacity="0.85">
    <circle cx="170" cy="110" r="34"/>
    <circle cx="120" cy="210" r="28"/>
    <circle cx="230" cy="220" r="30"/>
    <circle cx="330" cy="160" r="26"/>
    <line x1="170" y1="110" x2="120" y2="210"/>
    <line x1="170" y1="110" x2="230" y2="220"/>
    <line x1="230" y1="220" x2="330" y2="160"/>
  </g>
  <text x="390" y="180" font-family="Arial, sans-serif" font-size="52" fill="#ffffff" font-weight="700">HiTaxon</text>
  <text x="390" y="230" font-family="Arial, sans-serif" font-size="24" fill="#dbeafe">Hierarchical ML for metagenomics</text>
</svg>
